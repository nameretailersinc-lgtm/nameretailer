services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      MEDIA_ROOT: /app/uploads
    volumes:
      - media:/app/uploads
    restart: unless-stopped
    expose:
      - '3000'
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  media:
  caddy_data:
  caddy_config:
